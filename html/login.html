<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLens | Log In</title>
    <link rel="stylesheet" href="style_login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@email.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit">Log In</button>
            </form>
            
            <div id="message"></div>

            <div class="footer-text">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const messageDiv = document.getElementById("message");

            try {
                const response = await fetch("http://127.0.0.1:8000/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.className = "success";
                    messageDiv.innerText = "Login successful! Redirecting to dashboard...";
                    // You can store tokens or user roles here later
                } else {
                    messageDiv.className = "error";
                    messageDiv.innerText = data.detail || "Invalid credentials.";
                }
            } catch (err) {
                messageDiv.className = "error";
                messageDiv.innerText = "Unable to reach the backend server.";
            }
        });
    </script>
</body>
</html>
